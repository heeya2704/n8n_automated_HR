services:
  - type: web
    name: recruitment-app
    runtime: python
    pythonVersion: 3.10
    buildCommand: |
      cd backend && pip install -r requirements.txt && cd .. && \
      cd frontend && npm install && npm run build && cd ..
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: recruitment-app
          property: host
      - key: BACKEND_URL
        fromService:
          name: recruitment-app
          property: host
      - key: COMPANY_NAME
        value: TechCorp Solutions
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ENV
        value: production
      - key: N8N_TEST_RESULT_WEBHOOK_URL
        sync: false
    healthCheck:
      path: /
    routes:
      - type: http
        path: /

  - type: pserv
    name: recruitment-db
    ipAllowList: []
    plan: free
    postgresVersion: 15

databases:
  - name: recruitment_db
    databaseName: recruitment_db
    user: recruitment_user

envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: recruitment_db
      property: connectionString
